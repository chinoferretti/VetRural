# Spec Funcional — VetRural

> **Audiencia:** PMs, stakeholders, nuevos integrantes del equipo.
> **Generada:** 2026-05-11 via reverse-SDD
> **Leyenda:** `[INFERRED]` deducido del código · `[ASSUMPTION]` asunción a validar · `[CONFIRMED]` confirmado por el usuario

---

## 1. Propósito

VetRural es el backend de una aplicación web [CONFIRMED] que permite a veterinarios y productores agropecuarios registrar digitalmente el trabajo de campo durante campañas sanitarias y de revisación de hacienda bovina. Reemplaza el registro en papel que se hace en la manga —el corredor físico por donde pasa el ganado— concentrando en una sola sesión el tacto, el pesaje, el boqueo y la vacunación de cada animal.

## 2. Usuarios y actores

- **Veterinario** — ejecuta las revisaciones clínicas (tacto rectal, boqueo) y supervisa las vacunaciones. Sólo un usuario de tipo Veterinario puede ser asignado en ese rol.
- **Productor Agropecuario** — dueño o administrador del establecimiento. [INFERRED] consulta el historial de sus animales y los resultados de las sesiones.
- **Anotador** — cualquier usuario que registra los datos mientras el veterinario trabaja en la manga. Puede ser un empleado o el mismo productor.
- **App web (frontend)** [CONFIRMED] — cliente externo en repo separado que consume la API REST. El sistema no tiene interfaz propia; toda interacción ocurre vía HTTP.

## 3. Casos de uso principales

### CU-01: Abrir una sesión de trabajo

**Quién:** Anotador o Veterinario
**Qué:** Registrar el inicio de una jornada de revisación en un establecimiento.
**Flujo:**
1. El usuario selecciona el establecimiento donde se trabajará.
2. El sistema requiere identificar un anotador y un veterinario válidos.
3. El sistema crea la sesión con fecha y hora de inicio automáticas.
4. La sesión queda activa y lista para recibir registros.

**Reglas asociadas:** RN-01, RN-02.

---

### CU-02: Registrar un bovino nuevo

**Quién:** Anotador
**Qué:** Dar de alta un animal en el sistema antes o durante la sesión.
**Flujo:**
1. El anotador ingresa la caravana electrónica del animal (hasta 15 dígitos).
2. Puede registrarlo con datos completos o de forma rápida con solo ID y sexo.
3. El sistema guarda el bovino y lo deja disponible para actividades en manga.

**Reglas asociadas:** RN-03, RN-04.

---

### CU-03: Realizar tacto rectal en manga

**Quién:** Veterinario (ejecuta) / Anotador (registra)
**Qué:** Determinar el estado reproductivo de una vaca y registrarlo.
**Flujo:**
1. El bovino ingresa a la manga.
2. El veterinario realiza el tacto y comunica el resultado al anotador.
3. El anotador registra la situación (Preñada / Perdonada / Frigorífico / Apta para servicio) y el período de gestación si aplica.
4. El sistema persiste el registro y devuelve la situación confirmada.

**Reglas asociadas:** RN-05.

---

### CU-04: Registrar pesaje en manga

**Quién:** Anotador
**Qué:** Tomar y guardar el peso del animal.
**Flujo:**
1. El bovino es pesado en la balanza de la manga.
2. El anotador ingresa el peso en kg.
3. El sistema guarda el pesaje asociado al bovino.

**Reglas asociadas:** RN-05.

---

### CU-05: Realizar boqueo en manga

**Quién:** Veterinario (ejecuta) / Anotador (registra)
**Qué:** Estimar la edad del animal mediante examen de su dentición.
**Flujo:**
1. El veterinario examina: cantidad de dientes definitivos (2/4/6/8), tipo de dentadura (de leche/mixta/permanente) y grado de deterioro (nulo/leve/moderado/severo).
2. El anotador registra los tres parámetros.
3. El sistema guarda el boqueo asociado al bovino.

**Reglas asociadas:** RN-05.

---

### CU-06: Registrar vacunación en manga

**Quién:** Anotador
**Qué:** Dejar constancia de las vacunas aplicadas y sus fechas.
**Flujo:**
1. Se aplican las vacunas del plan sanitario.
2. El anotador registra las fechas: Aftosa, Brucelosis, Carbunco, Clostridial, IBR-BVD.
3. El sistema guarda el registro de vacunación del bovino.

**Reglas asociadas:** RN-05.

---

### CU-07: Cerrar sesión de trabajo

**Quién:** Anotador o Veterinario
**Qué:** Finalizar la jornada y registrar la hora de cierre.
**Flujo:**
1. Una vez procesados todos los animales, el usuario cierra la sesión.
2. El sistema registra la fecha y hora de finalización.
3. La sesión queda cerrada con sus estadísticas acumuladas.

**Reglas asociadas:** RN-06.

---

### CU-08: Gestionar lotes

**Quién:** Anotador o Productor
**Qué:** Agrupar bovinos bajo un nombre de lote para facilitar el manejo.
**Flujo:**
1. El usuario crea un lote con un nombre y asigna bovinos.
2. Puede agregar bovinos individuales a un lote existente.
3. Puede consultar todos los bovinos de un lote.
4. Puede eliminar un lote (los bovinos quedan sin lote, no se eliminan).

---

### CU-09: Consultar historial de bovinos

**Quién:** Veterinario, Productor, Anotador
**Qué:** Ver los datos y registros de un animal específico o de todos.
**Flujo:**
1. El usuario consulta por ID de bovino o lista todos.
2. El sistema devuelve los datos del animal con sus observaciones.

---

## 4. Reglas de negocio

- **RN-01:** Una sesión solo puede crearse si tanto el anotador como el veterinario existen y el veterinario tiene tipo `Veterinario`. [INFERRED]
- **RN-02:** Solo usuarios de tipo `Veterinario` pueden ser asignados al rol de veterinario en una sesión. [INFERRED]
- **RN-03:** Cada bovino se identifica por una caravana electrónica única de hasta 15 caracteres. [INFERRED]
- **RN-04:** Un bovino puede registrarse con datos mínimos (ID + sexo) para agilizar el ingreso en manga. [INFERRED]
- **RN-05:** Ninguna actividad en manga puede registrarse para un bovino que no esté dado de alta en el sistema. [INFERRED de `validarBovino()` en MangaService]
- **RN-06:** Una sesión acumula estadísticas (bovinos procesados, peso total, preñadas, vacías, edad promedio). [INFERRED]

## 5. Flujos clave

### Flujo: Jornada de manga completa

```mermaid
sequenceDiagram
    actor Anotador
    actor Veterinario
    participant Sistema
    Anotador->>Sistema: Abrir sesión (establecimiento, anotador, veterinario)
    Sistema-->>Anotador: Sesión creada con hora de inicio
    loop Por cada bovino
        Anotador->>Sistema: Verificar/registrar bovino (caravana)
        Veterinario->>Sistema: Registrar tacto (situación, período)
        Anotador->>Sistema: Registrar pesaje (kg)
        Veterinario->>Sistema: Registrar boqueo (dientes, deterioro, dentadura)
        Anotador->>Sistema: Registrar vacunación (fechas por vacuna)
    end
    Anotador->>Sistema: Cerrar sesión
    Sistema-->>Anotador: Sesión cerrada con estadísticas finales
```

### Flujo: Registro rápido de bovino nuevo en manga

Si el animal no está en el sistema, el anotador puede darlo de alta con solo caravana y sexo. Los datos restantes se completan después.

```mermaid
sequenceDiagram
    actor Anotador
    participant Sistema
    Anotador->>Sistema: GET /api/bovinos/{id}/existe
    Sistema-->>Anotador: false
    Anotador->>Sistema: POST /api/bovinos (id + sexo)
    Sistema-->>Anotador: Bovino creado
    Anotador->>Sistema: Continuar con actividades de manga
```

## 6. Estados y transiciones

### Entidad: Sesión

| Estado | Descripción | Transiciones permitidas |
|--------|-------------|--------------------------|
| `Activa` | Sesión iniciada, sin hora de fin | → `Cerrada` |
| `Cerrada` | Sesión finalizada con hora de cierre | — (estado final) |

> [INFERRED] El estado se infiere del campo `fechaHoraFin`: nulo = activa, con valor = cerrada.

### Situación post-tacto del bovino

| Situación | Descripción |
|-----------|-------------|
| `Preñada` | Animal gestante con período de gestación |
| `Perdonada` | No preñada pero se mantiene en el rodeo |
| `Frigorífico` | Descartada para faena |
| `Apta_Servicio` | Apta para entrar al servicio (reproducción) |

## 7. Out of scope

- No gestiona stock de medicamentos (solo registra fechas de aplicación).
- No calcula el plan sanitario ni genera recordatorios.
- No tiene interfaz de usuario propia — la UI vive en un repo separado. [CONFIRMED]
- No gestiona movimiento de animales entre establecimientos.
- No autentica ni autoriza usuarios en esta versión MVP. [INFERRED]
- No gestiona múltiples especies — modelo exclusivo para bovinos.

## 8. Glosario de dominio

- **Manga:** corredor físico por donde pasan los bovinos de a uno para ser revisados y tratados.
- **Caravana electrónica:** identificador único del animal (chip o tag en la oreja, hasta 15 dígitos).
- **Tacto rectal:** procedimiento veterinario para determinar el estado reproductivo de la vaca.
- **Boqueo:** examen de la dentición para estimar la edad del animal.
- **Pesaje:** toma del peso del animal en kilogramos.
- **Vacunación:** aplicación de vacunas del plan sanitario (Aftosa, Brucelosis, Carbunco, Clostridial, IBR-BVD).
- **Sesión:** unidad de trabajo de una jornada en un establecimiento, con anotador y veterinario asignados.
- **Establecimiento:** campo, estancia o explotación agropecuaria donde se realiza el trabajo.
- **Lote:** agrupación lógica de bovinos bajo un nombre común.
- **Anotador:** persona que opera el sistema durante la manga.

## 9. Asunciones a validar

- [x] El proyecto es un MVP/prototipo [CONFIRMED]
- [x] La app web existe en un repo separado [CONFIRMED]
- [ ] ASSUMPTION: La sesión puede tener múltiples instancias por día en el mismo establecimiento.
- [ ] ASSUMPTION: Las estadísticas de sesión son actualizadas por el cliente web, no calculadas automáticamente por el backend.
- [ ] ASSUMPTION: La entidad `Animal` existe como base para futura extensión a otras especies (equinos, ovinos, etc.).

# Spec Técnica — VetRural

> **Audiencia:** Desarrolladores que tienen que tocar este código.
> **Generada:** 2026-05-11 via reverse-SDD
> **Leyenda:** `[INFERRED]` deducido del código · `[ASSUMPTION]` asunción a validar · `[CONFIRMED]` confirmado por el usuario

---

## 1. Resumen técnico

VetRural es un monolito Spring Boot que expone una API REST. Corre en JVM (Java 17), persiste en SQLite mediante Hibernate/JPA, y es consumido por una app web en un repo separado [CONFIRMED]. No tiene frontend propio; Thymeleaf está en las dependencias pero sin implementación.

## 2. Stack y versiones

| Componente | Tecnología | Versión | Notas |
|------------|------------|---------|-------|
| Lenguaje | Java | 17 | |
| Framework | Spring Boot | 4.0.6 | Incluye Spring MVC |
| Persistencia | Spring Data JPA + Hibernate | (gestionada por Boot) | |
| Dialecto BD | hibernate-community-dialects | (gestionada por Boot) | SQLiteDialect |
| Base de datos | SQLite | runtime | Archivo local `vetrural.db` |
| Templates | Thymeleaf | (gestionada por Boot) | Incluido, sin templates implementados |
| Build | Maven | wrapper incluido | mvnw / mvnw.cmd |
| Boilerplate | Lombok | (gestionada por Boot) | @Getter, @Setter, @NoArgsConstructor, @AllArgsConstructor |
| Testing | Spring Boot Test | (gestionada por Boot) | Sin tests reales implementados |

## 3. Arquitectura

### 3.1 Estilo arquitectónico

Monolito en capas clásico (Spring MVC): Controller → Service → Repository → Entity. La lógica de negocio vive en los Services; los Controllers son delgados. No hay separación de dominio (DDD, hexagonal, o event-driven).

### 3.2 Estructura de carpetas

```
src/main/java/vetrural/mvc/
├── MvcApplication.java        # Entry point Spring Boot
├── controller/                # Handlers HTTP (@RestController)
│   ├── BovinoController.java  # /api/bovinos
│   ├── MangaController.java   # /api/manga
│   ├── SesionController.java  # /api/sesiones
│   └── UsuarioController.java # /api/usuarios
├── service/                   # Lógica de negocio
│   ├── MangaService.java      # Orquesta las 4 actividades de manga
│   ├── BovinoService.java
│   ├── SesionService.java
│   ├── UsuarioService.java
│   ├── TactoService.java
│   ├── PesajeService.java
│   ├── BoqueoService.java
│   └── VacunacionService.java
├── repository/                # Spring Data JPA interfaces
│   └── (7 repos: Bovino, Sesion, Usuario, Tacto, Pesaje, Boqueo, Vacunacion)
├── entity/                    # Entidades JPA
│   ├── Animal.java            # Clase base abstracta (JOINED inheritance)
│   ├── Bovino.java            # Extiende Animal
│   └── (Sesion, Usuario, Tacto, Pesaje, Boqueo, Vacunacion)
├── dto/                       # Request bodies (6 DTOs)
└── enumerations/              # 9 enums de dominio
```

### 3.3 Diagrama de componentes

```mermaid
graph LR
    WebApp["App Web (repo separado)"] -->|HTTP REST| Controllers
    subgraph VetRural
        Controllers --> Services
        Services --> Repositories
    end
    Repositories -->|JPA/Hibernate| DB[(SQLite vetrural.db)]
```

## 4. Modelo de datos

### 4.1 Entidades principales

#### Animal (abstracta)
- **Propósito:** clase base para especies animales.
- **Atributos:** `idAnimal` (String, 15 chars, PK, unique) · `nacimiento` (LocalDate) · `sexo` (SexoEnum) · `lote` (String) · `observaciones` (String)
- **Herencia:** `InheritanceType.JOINED`

#### Bovino
- **Atributos extra:** `raza` (RazaBovinoEnum) · `tipo` (TipoBovinoEnum)
- **Tabla:** `Bovino` JOIN con `Animal`

#### Sesion
- **Atributos:** `idSesion` (Long, auto) · `establecimiento` · `fechaHoraInicio` · `fechaHoraFin` (null si activa) · `anotador` (FK Usuario) · `veterinario` (FK Usuario)
- **Estadísticas:** `contBovinos` · `acumPeso` · `contPrenadas` · `contVacias` · `edadPromedio`

#### Usuario
- **Atributos:** `idUsuario` (Long, auto) · `nombre` · `apellido` · `email` · `contrasena` · `tipo` (TipoUsuarioEnum)
- **Colección:** `establecimientos` (List, tabla `usuario_establecimientos`)

#### Tacto / Pesaje / Boqueo / Vacunacion
- Todos referencia `idBovino` como String (FK lógica, no JPA). Cada uno con PK Long autogenerada.
- **Tacto:** `situacion` (SituacionEnum) · `periodo` (PeriodoEnum)
- **Pesaje:** `peso` (float)
- **Boqueo:** `dientes` · `deterioro` · `dentadura` (enums)
- **Vacunacion:** 5 fechas LocalDate (aftosa, brucelosis, carbunco, clostridial, ibr_bvd)

### 4.2 Enumeraciones

| Enum | Valores |
|------|---------|
| `TipoBovinoEnum` | Ternero · Novillito · Novillo · Vaquillona · Vaca · Torito · Toro |
| `RazaBovinoEnum` | Angus · Hereford · Brangus · Braford · Holstein · Jersey · Charolais · Limousin · Simmental · Brahman · Nelore · Gyr |
| `SituacionEnum` | Preñada · Perdonada · Frigorífico · Apta_Servicio |
| `PeriodoEnum` | Menos_3_Meses · Entre_3_y_6_Meses · Mas_6_Meses |
| `DientesEnum` | Dos · Cuatro · Seis · Ocho |
| `DeterioroEnum` | Nulo · Leve · Moderado · Severo |
| `DentaduraEnum` | De_Leche · Mixta · Permanente |
| `TipoUsuarioEnum` | Veterinario · Productor_Agropecuario · Otro |

### 4.3 Migraciones

No hay sistema de migraciones formal. `ddl-auto=update` — Hibernate gestiona el schema al arrancar. Riesgo en producción: actualizaciones no controladas del schema.

## 5. Superficie de API

### 5.1 Endpoints HTTP

**Bovinos** `/api/bovinos`

| Método | Ruta | Propósito |
|--------|------|-----------|
| GET | `/api/bovinos` | Listar todos |
| GET | `/api/bovinos/{id}` | Obtener por ID |

## 8. Decisiones técnicas y trade-offs

### TD-01: SQLite como base de datos

- **Contexto:** contexto rural, potencialmente sin servidor de BD central.
- **Decisión:** SQLite embebido en archivo local.
- **Trade-off:** cero infraestructura, portabilidad total. Contra: sin concurrencia real, sin replicación, sin acceso remoto multi-dispositivo simultáneo.
- **Status:** [INFERRED]

### TD-02: Registro rápido de bovino (`crearBovinoRapido`)

- **Contexto:** en la manga el tiempo es crítico; completar todos los datos interrumpe el flujo.
- **Decisión:** endpoint que crea bovino con solo ID + sexo.
- **Trade-off:** fluidez operacional vs. datos incompletos en BD.
- **Status:** [INFERRED]

### TD-03: Herencia JOINED en Animal

- **Contexto:** el modelo prevé extensión a otras especies.
- **Decisión:** `Animal` abstracta con `InheritanceType.JOINED`.
- **Trade-off:** extensibilidad futura vs. JOIN extra en cada consulta.
- **Status:** [ASSUMPTION]

### TD-04: MangaService como orquestador

- **Contexto:** las 4 operaciones de manga comparten la validación de existencia del bovino.
- **Decisión:** service dedicado que valida y delega a services específicos.
- **Trade-off:** centraliza RN-05 en un lugar. Contra: capa extra de indirección.
- **Status:** [INFERRED]

### TD-05: Lotes como campo String en Animal

- **Contexto:** los lotes agrupan bovinos para el manejo.
- **Decisión:** `lote` como String en Animal, no como entidad con FK.
- **Trade-off:** implementación simple y rápida. Contra: sin integridad referencial; inconsistencias por diferencias de escritura.
- **Status:** [INFERRED]

- **Build:** `./mvnw clean package` → JAR ejecutable en `target/`
- **Runtime:** `java -jar target/mvc-0.0.1-SNAPSHOT.jar` (Tomcat embebido) [INFERRED]

- **Logging:** Logback estándar de Spring Boot. `show-sql=true` imprime todas las queries. Sin formato JSON ni destino externo.

## 11. Testing

- **Frameworks:** Spring Boot Test declarado como dependencia.

- **Cobertura:** prácticamente nula.
- **Comando:** `./mvnw test`

## 12. Gaps técnicos detectados

- **Sin autenticación ni autorización:** todos los endpoints son públicos. Crítico para producción.
- **Bug en BovinoController:** dos métodos `@PostMapping` sin path diferente en la misma clase (`crear` y `crearRapido`). Spring MVC fallará al mapear las rutas. Requiere separar (ej. `@PostMapping("/rapido")`).
- **Sin validaciones de entrada:** ningún DTO usa `@Valid` o `@NotNull`. Requests malformados generan HTTP 500 genérico.
- **Sin manejo global de errores:** no hay `@ControllerAdvice`. Las `IllegalArgumentException` de los services resultan en 500 en lugar de 400/404.
- **FKs lógicas en entidades de manga:** `Tacto`, `Pesaje`, `Boqueo`, `Vacunacion` referencian bovino por String, no por FK JPA. Sin integridad referencial a nivel BD.
- **ddl-auto=update:** riesgo en producción. Considerar Flyway o Liquibase.
- **show-sql=true:** muy ruidoso en producción.
- **Contraseña en texto plano:** campo `contrasena` en `Usuario` sin hasheo. Crítico para usuarios reales.
- **Sin tests:** ningún test de comportamiento. Sin cobertura de reglas de negocio.

## 13. Asunciones a validar

- [ ] ASSUMPTION: El campo `lote` como String fue una decisión consciente de velocidad, no un accidente.
- [ ] ASSUMPTION: Para producción se parametrizará la ruta de `vetrural.db` via variable de entorno.
- [ ] ASSUMPTION: La app web es responsable de actualizar las estadísticas de sesión, el backend no lo hace automáticamente.

<script>
  marked.setOptions({ gfm: true, breaks: false });

  function highlightMarkers(html) {
    return html
      .replace(/\[INFERRED\]/g, '<span class="marker marker-inferred">INFERRED</span>')
      .replace(/\[ASSUMPTION\]/g, '<span class="marker marker-assumption">ASSUMPTION</span>')
      .replace(/\[CONFIRMED\]/g, '<span class="marker marker-confirmed">CONFIRMED</span>');
  }

  function renderMarkdown(md) {
    const mermaidBlocks = [];
    md = md.replace(/```mermaid\n([\s\S]*?)```/g, (_, code) => {
      const i = mermaidBlocks.length;
      mermaidBlocks.push(code);
      return `<div class="mermaid" data-mermaid-idx="${i}"></div>`;
    });
    let html = marked.parse(md);
    html = highlightMarkers(html);
    html = html.replace(/<div class="mermaid" data-mermaid-idx="(\d+)"><\/div>/g, (_, idx) => {
      return `<div class="mermaid">${mermaidBlocks[parseInt(idx)]}</div>`;
    });
    return html;
  }

  function buildTOC(container) {
    const items = [];
    container.querySelectorAll('h2, h3').forEach((h, i) => {
      const id = 'h-' + (h.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 60)) + '-' + i;
      h.id = id;
      items.push({ id, text: h.textContent.trim(), level: parseInt(h.tagName.slice(1)) });
    });
    return items;
  }

  function renderTOC(items) {
    const toc = document.getElementById('toc');
    toc.innerHTML = items.map(i =>
      `<li><a href="#${i.id}" class="level-${i.level}" data-target="${i.id}">${i.text}</a></li>`
    ).join('');
    toc.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        document.getElementById(a.dataset.target).scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }

  function countMarkers(html) {
    return {
      inferred: (html.match(/marker-inferred/g) || []).length,
      assumption: (html.match(/marker-assumption/g) || []).length,
      confirmed: (html.match(/marker-confirmed/g) || []).length
    };
  }

  function renderToolbar(counts) {
    document.getElementById('toolbar').innerHTML = `
      <span class="chip">Inferred <strong>${counts.inferred}</strong></span>
      <span class="chip">Assumption <strong>${counts.assumption}</strong></span>
      <span class="chip">Confirmed <strong>${counts.confirmed}</strong></span>
    `;
  }

  const mdFunctional = document.getElementById('md-functional').textContent.trim();
  const mdTechnical = document.getElementById('md-technical').textContent.trim();

  const paneF = document.getElementById('pane-functional');
  const paneT = document.getElementById('pane-technical');
  paneF.innerHTML = renderMarkdown(mdFunctional);
  paneT.innerHTML = renderMarkdown(mdTechnical);

  const tocF = buildTOC(paneF);
  const tocT = buildTOC(paneT);

  function activatePane(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.pane === name));
    document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + name));
    renderTOC(name === 'functional' ? tocF : tocT);
    renderToolbar(countMarkers((name === 'functional' ? paneF : paneT).innerHTML));
    document.querySelector('.content').scrollTop = 0;
  }

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => activatePane(t.dataset.pane)));

  activatePane('functional');

  mermaid.initialize({
    startOnLoad: true,
    theme: 'dark',
    themeVariables: { background: '#1c2030', primaryColor: '#262a38', primaryTextColor: '#e6e8ee', lineColor: '#7c8cff' }
  });
  mermaid.run();
</script>
